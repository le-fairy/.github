# PR 텔레그램 알림 — 재사용 워크플로.
# 각 저장소의 .github/workflows/pr-telegram-notify.yml 이 pull_request(opened, reopened)에서 부른다.
# 비밀값 TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID 는 부르는 저장소에 넣는다(secrets: inherit).
# 비밀값이 없으면 실패하지 않고 건너뛴다. 텔레그램이 ok:false 를 주면 실패로 끝난다.
# 체크아웃하지 않는다. PR 제목·브랜치명은 env 로만 넘긴다(스크립트 주입 방지).
name: PR 텔레그램 알림 (재사용)

on:
  workflow_call:
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

permissions: {}

jobs:
  notify:
    name: 텔레그램 알림
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 텔레그램으로 보내기
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            echo "::notice title=텔레그램 알림::비밀값 없음, 건너뜀 (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID 를 저장소 비밀값에 넣으면 보냄)"
            exit 0
          fi

          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::notice title=텔레그램 알림::pull_request 이벤트가 아니라서 건너뜀"
            exit 0
          fi

          header="🔔 새 PR"
          if [ "${PR_ACTION}" = "reopened" ]; then
            header="🔁 다시 열린 PR"
          fi
          draft=""
          if [ "${PR_DRAFT}" = "true" ]; then
            draft=" (초안)"
          fi

          text="$(printf '%s%s\n%s\n#%s %s\n작성자: %s\n%s → %s\n%s' \
            "$header" "$draft" "$REPO" "$PR_NUMBER" "$PR_TITLE" "$PR_AUTHOR" "$HEAD_REF" "$BASE_REF" "$PR_URL")"

          response="$(curl -sS --max-time 20 --retry 2 \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode 'link_preview_options={"is_disabled":true}')"

          if [ "$(jq -r '.ok // false' <<<"$response" 2>/dev/null || echo false)" != "true" ]; then
            description="$(jq -r '.description // "응답을 읽지 못함"' <<<"$response" 2>/dev/null || echo "응답을 읽지 못함")"
            echo "::error title=텔레그램 알림::보내기 실패: ${description}"
            exit 1
          fi

          echo "텔레그램으로 보냄: ${REPO} #${PR_NUMBER}"
